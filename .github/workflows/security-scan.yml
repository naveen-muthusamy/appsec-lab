name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install gitleaks 8.21.2 (checksum verified)
        run: |
          cd /tmp
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks_8.21.2_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install semgrep 1.185.0
        run: pip install semgrep==1.185.0

      - name: Run all scans
        run: ./run.sh

      - name: Show triage report
        if: always()
        run: cat artifacts/triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: artifacts/
          retention-days: 14
